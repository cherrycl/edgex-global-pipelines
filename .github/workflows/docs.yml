name: Docs
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'
      - name: Generate Documentation
        run: ./gradlew clean generateDocumentation
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: MkDocs Build
        run: |
          pip install mkdocs "mkdocs-material>=8.2"
          mkdocs build

      # Same behavior as edgeXGHPagesPublish
      - name: Checkout gh-pages
        if: github.event_name == 'push' && github.repository_owner == 'edgexfoundry'
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: gh-pages
      - name: Publish to GitHub pages
        if: github.event_name == 'push' && github.repository_owner == 'edgexfoundry'
        run: |
          set -euo pipefail
          COMMIT_MSG=$(git log -1 --format=%s)
          cp -rf docs/* gh-pages/
          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish"; exit 0
          fi
          git commit -s -m "ci: ${COMMIT_MSG}"
          git push origin gh-pages
